# Runs the TypeScript type check (no build, nothing is emitted) on every
# pull request and on pushes to main. Files opt in with `// @ts-check`.
name: Type check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: How to play — guide and baseline agree
        run: node scripts/howtoplay/check.mjs --strict
